<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDU Seat Plan Generator — East Delta University</title>
<style>
  /* ── TOKENS ── */
  :root {
    --navy:   #1a2744;
    --navy2:  #243058;
    --gold:   #c8972a;
    --gold2:  #e8b84b;
    --light:  #f5f7fa;
    --border: #dce2ec;
    --text:   #1e2533;
    --muted:  #6b7591;
    --green:  #1e7d5a;
    --red:    #c0392b;
    --white:  #ffffff;
    --radius: 6px;
    --shadow: 0 2px 10px rgba(26,39,68,.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--light);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    color: var(--white);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 3px solid var(--gold);
  }
  header .logo {
    width: 48px; height: 48px;
    background: var(--gold);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; color: var(--navy); flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  header p  { font-size: 12px; color: #a8b4d0; margin-top: 2px; }

  /* ── LAYOUT ── */
  .app { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 73px); }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--white);
    border-right: 1px solid var(--border);
    padding: 24px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 20px;
  }

  .panel { background: var(--light); border-radius: var(--radius); padding: 16px; }
  .panel-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted); margin-bottom: 12px;
  }

  /* Exam meta */
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 13px; background: var(--white);
    color: var(--text);
  }
  .field input:focus { outline: none; border-color: var(--gold); }

  /* Rooms */
  .room-row {
    display: grid; grid-template-columns: 1fr 48px 48px;
    gap: 6px; align-items: center; margin-bottom: 6px;
  }
  .room-row .room-name { font-size: 13px; font-weight: 600; }
  .room-row input {
    padding: 5px 6px; border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 12px; text-align: center;
    background: var(--white); width: 100%;
  }
  .room-row .col-label { font-size: 10px; color: var(--muted); text-align: center; }
  .room-tag {
    display: inline-block; font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 3px; margin-left: 6px;
  }
  .tag-main { background: #e8f0fe; color: #1a56c4; }
  .tag-novus { background: #fff3cd; color: #856404; }

  /* Courses */
  .course-row {
    display: grid; grid-template-columns: 1fr 52px 24px;
    gap: 6px; align-items: center; margin-bottom: 5px;
  }
  .course-row input { padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; background: var(--white); width: 100%; }
  .course-row input:focus { outline: none; border-color: var(--gold); }
  .course-row .n-input { text-align: center; }
  .del-btn {
    width: 22px; height: 22px; border: none; background: none;
    color: #c0392b; cursor: pointer; font-size: 16px; line-height: 1;
    border-radius: 3px; display: flex; align-items: center; justify-content: center;
  }
  .del-btn:hover { background: #fdecea; }
  .add-btn {
    width: 100%; padding: 7px; border: 1px dashed var(--border);
    background: none; border-radius: var(--radius);
    font-size: 12px; color: var(--muted); cursor: pointer; margin-top: 4px;
  }
  .add-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* Generate btn */
  .gen-btn {
    width: 100%; padding: 12px;
    background: var(--navy); color: var(--white);
    border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 700; cursor: pointer;
    letter-spacing: .3px; transition: background .15s;
  }
  .gen-btn:hover { background: var(--navy2); }
  .gen-btn:active { background: var(--gold); color: var(--navy); }

  .print-btn {
    width: 100%; padding: 9px;
    background: none; color: var(--navy); border: 1px solid var(--navy);
    border-radius: var(--radius); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .print-btn:hover { background: var(--navy); color: var(--white); }

  /* ── MAIN OUTPUT ── */
  .output {
    padding: 28px 32px;
    overflow-y: auto;
  }

  .placeholder {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: var(--muted); text-align: center;
  }
  .placeholder svg { opacity: .25; }
  .placeholder h2 { font-size: 18px; font-weight: 600; color: var(--navy); opacity: .4; }
  .placeholder p  { font-size: 13px; max-width: 280px; line-height: 1.6; }

  /* Status */
  .status-bar {
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 16px;
    display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;
    font-size: 12px;
  }
  .stat { display: flex; gap: 6px; align-items: center; }
  .stat-label { color: var(--muted); font-weight: 500; }
  .stat-value { font-weight: 700; color: var(--navy); }
  .stat-ok    { color: var(--green); font-weight: 700; }
  .stat-warn  { color: var(--red); font-weight: 700; }

  /* Exam header in output */
  .exam-header {
    background: var(--navy); color: var(--white);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 14px 20px; margin-bottom: 0;
  }
  .exam-header h2 { font-size: 16px; font-weight: 700; }
  .exam-header p  { font-size: 12px; color: #a8b4d0; margin-top: 3px; }

  /* Building sections */
  .building-section { margin-bottom: 28px; }
  .building-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .9px; color: var(--gold); border-bottom: 2px solid var(--gold);
    padding-bottom: 4px; margin: 20px 0 14px;
  }

  /* Room card */
  .room-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 18px;
    box-shadow: var(--shadow); overflow: hidden;
    page-break-inside: avoid;
  }
  .room-card-header {
    background: var(--navy2); color: var(--white);
    padding: 8px 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .room-card-header .rname { font-size: 13px; font-weight: 700; }
  .room-card-header .rmeta { font-size: 11px; color: #a8b4d0; }
  .room-card-body { padding: 12px; overflow-x: auto; }

  /* Seat grid */
  .seat-grid { border-collapse: collapse; font-size: 11px; width: 100%; }
  .seat-grid th {
    background: #f0f3f8; padding: 5px 8px; text-align: center;
    font-weight: 600; color: var(--muted); border: 1px solid var(--border);
    font-size: 10px;
  }
  .seat-grid td {
    padding: 5px 8px; text-align: center; border: 1px solid var(--border);
    font-size: 11px; min-width: 80px; font-weight: 500;
  }
  .seat-grid td.empty { color: #ccc; font-size: 10px; }
  .seat-grid .row-label {
    font-size: 10px; color: var(--muted); font-weight: 600;
    background: #f8f9fc; min-width: 40px;
  }

  /* Course legend in room */
  .room-legend {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px;
    border-top: 1px solid var(--border); background: #fafbfd;
  }
  .legend-chip {
    font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 10px;
    background: var(--light); border: 1px solid var(--border);
    color: var(--navy);
  }

  /* Summary table */
  .summary-section { margin-top: 28px; }
  .summary-title {
    font-size: 15px; font-weight: 700; color: var(--navy);
    margin-bottom: 12px; padding-bottom: 6px;
    border-bottom: 2px solid var(--navy);
  }
  .summary-table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .summary-table th {
    background: var(--navy); color: var(--white);
    padding: 8px 10px; text-align: center; border: 1px solid #3a4d7a;
    font-size: 11px; font-weight: 600;
  }
  .summary-table td {
    padding: 7px 10px; text-align: center; border: 1px solid var(--border);
  }
  .summary-table tr:nth-child(even) td { background: #f8f9fc; }
  .summary-table td.course-name { text-align: left; font-weight: 600; color: var(--navy); }
  .summary-table td.zero { color: #ccc; }
  .summary-table .total-row td {
    background: var(--navy); color: var(--white); font-weight: 700;
  }
  .summary-table td.grand { color: var(--gold2); font-weight: 800; font-size: 14px; }

  /* Error messages */
  .error-box {
    background: #fdecea; border: 1px solid #f5c6cb;
    border-radius: var(--radius); padding: 12px 16px;
    color: var(--red); font-size: 13px; margin-bottom: 16px;
  }

  /* Color assignment per course (cycle) */
  .c0 { background: #e8f4fd; }
  .c1 { background: #eafaf1; }
  .c2 { background: #fef9e7; }
  .c3 { background: #fdf2f8; }
  .c4 { background: #f0f3ff; }
  .c5 { background: #fff5f5; }
  .c6 { background: #f0faf5; }
  .c7 { background: #fffbf0; }
  .c8 { background: #f5f0ff; }
  .c9 { background: #f0f9ff; }
  .c10{ background: #fff0f6; }
  .c11{ background: #f0fff4; }
  .c12{ background: #fffaf0; }

  /* ── PRINT ── */
  @media print {
    .sidebar, .print-btn, .gen-btn { display: none !important; }
    .app { grid-template-columns: 1fr; }
    .output { padding: 0; }
    header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .room-card { page-break-inside: avoid; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>

<header>
  <div class="logo">EDU</div>
  <div>
    <h1>Seat Plan Generator</h1>
    <p>East Delta University — Examination Division</p>
  </div>
</header>

<div class="app">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar">

    <!-- Exam Info -->
    <div class="panel">
      <div class="panel-title">Exam Details</div>
      <div class="field"><label>Exam Name</label>
        <input type="text" id="examName" value="Final Exam - Spring 2026" placeholder="e.g. Final Exam - Spring 2026">
      </div>
      <div class="field"><label>Date</label>
        <input type="text" id="examDate" value="05.05.26" placeholder="dd.mm.yy">
      </div>
      <div class="field"><label>Time</label>
        <input type="text" id="examTime" value="7:00 PM – 8:30 PM" placeholder="e.g. 7:00 PM – 8:30 PM">
      </div>
    </div>

    <!-- Rooms -->
    <div class="panel">
      <div class="panel-title">Rooms &amp; Capacity</div>
      <div id="roomList"></div>
      <button class="add-btn" onclick="addRoom()">+ Add Room</button>
    </div>

    <!-- Courses -->
    <div class="panel">
      <div class="panel-title">Courses &amp; Student Count</div>
      <div style="display:grid;grid-template-columns:1fr 52px 24px;gap:6px;margin-bottom:4px;">
        <span style="font-size:10px;color:var(--muted);font-weight:600;">Course Code</span>
        <span style="font-size:10px;color:var(--muted);font-weight:600;text-align:center;">Students</span>
        <span></span>
      </div>
      <div id="courseList"></div>
      <button class="add-btn" onclick="addCourse()">+ Add Course</button>
    </div>

    <button class="gen-btn" onclick="generate()">⚡ Generate Seat Plan</button>
        <button class="print-btn" onclick="window.print()">🖨 Print / Export PDF</button>
    <button class="print-btn" style="margin-top:6px;border-color:var(--gold);color:var(--gold);" onclick="exportDocx()">📄 Export Word (.docx)</button>

  </aside>

  <!-- ══ OUTPUT ══ -->
  <main class="output" id="output">
    <div class="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
      </svg>
      <h2>No plan generated yet</h2>
      <p>Fill in the exam details, configure your rooms and courses, then click Generate.</p>
    </div>
  </main>

</div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let rooms = [
  { id:'R108',  rows:7, cols:4, building:'main'  },
  { id:'R110',  rows:7, cols:4, building:'main'  },
  { id:'R111',  rows:7, cols:4, building:'main'  },
  { id:'R114',  rows:7, cols:4, building:'main'  },
  { id:'R311',  rows:7, cols:4, building:'main'  },
  { id:'R312',  rows:7, cols:4, building:'main'  },
  { id:'Sem2',  rows:8, cols:7, building:'main'  },
  { id:'N-203', rows:6, cols:6, building:'novus' },
  { id:'N-204', rows:6, cols:6, building:'novus' },
];

let courses = [
  { code:'CSE 115',   n:28 },
  { code:'CSE 225',   n:29 },
  { code:'CSE 311.2', n:29 },
  { code:'CSE 411',   n:9  },
  { code:'CSE 435',   n:13 },
  { code:'EEE 203',   n:33 },
  { code:'EEE 213.1', n:25 },
  { code:'EEE 213.2', n:15 },
  { code:'EEE 311.1', n:22 },
  { code:'EEE 311.2', n:14 },
  { code:'EEE 313',   n:31 },
  { code:'EEE 405',   n:29 },
];

// ══════════════════════════════════════════
// RENDER SIDEBAR
// ══════════════════════════════════════════
function renderRooms() {
  const el = document.getElementById('roomList');
  el.innerHTML = rooms.map((r,i) => `
    <div style="margin-bottom:8px;border:1px solid var(--border);border-radius:var(--radius);padding:8px;background:var(--white);">
      <div style="display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:6px;">
        <input type="text" value="${r.id}" placeholder="Room name"
          style="padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-weight:600;"
          onchange="rooms[${i}].id=this.value.trim()">
        <button class="del-btn" onclick="delRoom(${i})" title="Remove room" style="width:26px;height:26px;font-size:18px;">×</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center;">
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:2px;">Rows</div>
          <input type="number" min="1" max="20" value="${r.rows}"
            style="width:100%;padding:5px 6px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;text-align:center;"
            onchange="rooms[${i}].rows=+this.value">
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:2px;">Cols</div>
          <input type="number" min="1" max="20" value="${r.cols}"
            style="width:100%;padding:5px 6px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;text-align:center;"
            onchange="rooms[${i}].cols=+this.value">
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:2px;">Building</div>
          <select onchange="rooms[${i}].building=this.value"
            style="width:100%;padding:5px 4px;border:1px solid var(--border);border-radius:var(--radius);font-size:11px;background:var(--white);">
            <option value="main"  ${r.building==='main' ?'selected':''}>Main</option>
            <option value="novus" ${r.building==='novus'?'selected':''}>Novus</option>
          </select>
        </div>
      </div>
    </div>`).join('');
}

function renderCourses() {
  const el = document.getElementById('courseList');
  el.innerHTML = courses.map((c,i) => `
    <div class="course-row">
      <input type="text" value="${c.code}" placeholder="Course code"
        onchange="courses[${i}].code=this.value.trim()">
      <input type="number" class="n-input" min="1" max="500" value="${c.n}"
        onchange="courses[${i}].n=+this.value">
      <button class="del-btn" onclick="delCourse(${i})" title="Remove">×</button>
    </div>`).join('');
}

function addRoom() {
  rooms.push({ id:'Room'+(rooms.length+1), rows:7, cols:4, building:'main' });
  renderRooms();
}
function delRoom(i) {
  rooms.splice(i,1);
  renderRooms();
}
function addCourse() {
  courses.push({ code:'', n:0 });
  renderCourses();
}
function delCourse(i) {
  courses.splice(i,1);
  renderCourses();
}

// ══════════════════════════════════════════
// SUB-GRID ENGINE
// ══════════════════════════════════════════
function getSubgrids(rows, cols) {
  // odd rows: 1,3,5... even rows: 2,4,6...
  // odd cols: 1,3,5... even cols: 2,4,6...
  const oddR = [], evenR = [], oddC = [], evenC = [];
  for(let r=1;r<=rows;r++) (r%2===1?oddR:evenR).push(r);
  for(let c=1;c<=cols;c++) (c%2===1?oddC:evenC).push(c);

  const SG1=[],SG2=[],SG3=[],SG4=[];
  for(const r of oddR)  for(const c of oddC)  SG1.push([r,c]);
  for(const r of oddR)  for(const c of evenC) SG2.push([r,c]);
  for(const r of evenR) for(const c of oddC)  SG3.push([r,c]);
  for(const r of evenR) for(const c of evenC) SG4.push([r,c]);
  return [SG1,SG2,SG3,SG4];
}

// ══════════════════════════════════════════
// ALLOCATION ENGINE
// ══════════════════════════════════════════
function allocate(rooms, courses) {
  const OVERFLOW_MAX = 2;

  function buildOrderedSlots() {
    const roomSGs = {};
    for (const room of rooms) {
      const sgs = getSubgrids(room.rows, room.cols);
      const caps = sgs.map((sg,i)=>({cap:sg.length,sgIdx:i,seats:sg}))
                      .filter(x=>x.cap>0)
                      .sort((a,b)=>b.cap-a.cap);
      roomSGs[room.id] = caps;
    }
    const maxRounds = Math.max(...Object.values(roomSGs).map(v=>v.length));
    const slots = [];
    for (let rnd=0; rnd<maxRounds; rnd++) {
      const rs = [];
      for (const room of rooms) {
        const sgsR = roomSGs[room.id];
        if (rnd < sgsR.length) {
          const {cap,sgIdx,seats} = sgsR[rnd];
          rs.push({roomId:room.id,sgIdx,cap,seats,course:null,filled:0,building:room.building});
        }
      }
      rs.sort((a,b)=>b.cap-a.cap);
      slots.push(...rs);
    }
    return slots;
  }

  const slots = buildOrderedSlots();
  const remaining    = {};
  const courseRooms  = {};
  const lastRoom     = {};
  for (const c of courses) {
    remaining[c.code]   = c.n;
    courseRooms[c.code] = new Set();
    lastRoom[c.code]    = null;
  }
  const pendingOvf = {};  // course -> count (small remainders, may be absorbed)

  // Pass 1: round-robin slot assignment
  for (const slot of slots) {
    const eligible = courses.filter(c =>
      remaining[c.code] > OVERFLOW_MAX &&
      !courseRooms[c.code].has(slot.roomId)
    );
    if (!eligible.length) continue;
    const best = eligible.reduce((b,c) => {
      const need=remaining[c.code], fill=Math.min(need,slot.cap), rem=need-fill;
      const sc = rem===0 ? [0,slot.cap-fill] : rem<=OVERFLOW_MAX ? [1,rem] : [2,-need];
      if (!b) return {c,sc};
      if (sc[0]<b.sc[0]||(sc[0]===b.sc[0]&&sc[1]<b.sc[1])) return {c,sc};
      return b;
    }, null);
    const code=best.c.code, fill=Math.min(remaining[code],slot.cap), rem=remaining[code]-fill;
    slot.course=code; slot.filled=fill;
    courseRooms[code].add(slot.roomId);
    lastRoom[code]=slot.roomId;
    remaining[code]=rem;
    if (rem>0 && rem<=OVERFLOW_MAX) {
      pendingOvf[code]=(pendingOvf[code]||0)+rem;
      remaining[code]=0;
    }
  }
  for (const c of courses) {
    const need=remaining[c.code];
    if (need>0 && need<=OVERFLOW_MAX) { pendingOvf[c.code]=(pendingOvf[c.code]||0)+need; remaining[c.code]=0; }
    else if (need>0) c._unplaced=need;
  }

  // Pass 2: try to absorb pending overflows into existing slot slack
  const rawOverflows = [];
  for (const [code,cnt] of Object.entries(pendingOvf)) {
    let count=cnt;
    for (const slot of slots) {
      if (count<=0) break;
      if (slot.course===code && slot.filled<slot.cap) {
        const extra=Math.min(count,slot.cap-slot.filled);
        slot.filled+=extra; count-=extra;
      }
    }
    if (count>0) rawOverflows.push({course:code,count,preferredRoom:lastRoom[code]});
  }

  // Distribute overflows to room corner cells (max 2 per room)
  const gridMap={};
  for (const room of rooms) gridMap[room.id]={};
  for (const slot of slots) {
    if (!slot.course) continue;
    const sgs=getSubgrids(rooms.find(r=>r.id===slot.roomId).rows,rooms.find(r=>r.id===slot.roomId).cols);
    for (let i=0;i<slot.filled;i++) { const [r,c]=sgs[slot.sgIdx][i]; gridMap[slot.roomId][`${r},${c}`]=slot.course; }
  }
  const corners={};
  for (const room of rooms) corners[room.id]={
    left: gridMap[room.id][`1,1`]||null,
    right:gridMap[room.id][`1,${room.cols}`]||null
  };
  const roomOvf={};
  for (const room of rooms) roomOvf[room.id]={left:null,right:null};
  function tryPlace(ov,roomId) {
    const o=roomOvf[roomId],c=corners[roomId];
    if (!o.right&&c.right!==ov.course){o.right=ov;return true;}
    if (!o.left &&c.left !==ov.course){o.left =ov;return true;}
    return false;
  }
  const unresolved=[];
  for (const ov of rawOverflows) {
    let placed=false;
    if (ov.preferredRoom&&tryPlace(ov,ov.preferredRoom)) placed=true;
    if (!placed) for (const room of rooms) { if(room.id===ov.preferredRoom) continue; if(slots.some(s=>s.roomId===room.id&&s.course===ov.course)) if(tryPlace(ov,room.id)){placed=true;break;} }
    if (!placed) for (const room of rooms) if(tryPlace(ov,room.id)){placed=true;break;}
    if (!placed) unresolved.push(ov);
  }

  const roomAllocations={};
  for (const room of rooms) roomAllocations[room.id]=[];
  for (const slot of slots) if(slot.course) roomAllocations[slot.roomId].push({sgIdx:slot.sgIdx,course:slot.course,filled:slot.filled,cap:slot.cap,seats:slot.seats});
  const courseTotals={};
  for (const slot of slots) if(slot.course) courseTotals[slot.course]=(courseTotals[slot.course]||0)+slot.filled;
  for (const room of rooms) for (const ov of Object.values(roomOvf[room.id])) if(ov) courseTotals[ov.course]=(courseTotals[ov.course]||0)+ov.count;
  const errors=courses.filter(c=>c._unplaced>0).map(c=>`${c.code}: ${c._unplaced} student(s) could not be placed — add a row to a room.`);
  if (unresolved.length) errors.push(`${unresolved.reduce((s,o)=>s+o.count,0)} overflow student(s) have no cell — add 1 row to any room.`);
  return {roomAllocations,roomOvf,courseTotals,errors};
}

// RENDER OUTPUT
// ══════════════════════════════════════════
const COLORS = ['c0','c1','c2','c3','c4','c5','c6','c7','c8','c9','c10','c11','c12'];

function generate() {
  const name  = document.getElementById('examName').value.trim();
  const date  = document.getElementById('examDate').value.trim();
  const time  = document.getElementById('examTime').value.trim();
  

  const validCourses = courses.filter(c=>c.code && c.n>0);
  const totalStudents = validCourses.reduce((s,c)=>s+c.n,0);
  const totalCap = rooms.reduce((s,r)=>s+r.rows*r.cols,0);

  if(!validCourses.length){
    document.getElementById('output').innerHTML = `<div class="error-box">Please add at least one course with students.</div>`;
    return;
  }

  //const result = allocate(rooms, validCourses);
  const { roomAllocations, roomOvf, courseTotals, errors } = allocate(rooms, validCourses);

  // Colour map
  const colourMap = {};
  validCourses.forEach((c,i) => colourMap[c.code] = COLORS[i % COLORS.length]);

  // Build course→rooms map for summary
  const courseRoomMap = {}; // course -> {roomId: count}
  for(const room of rooms){
    for(const alloc of (roomAllocations[room.id]||[])){
      if(!courseRoomMap[alloc.course]) courseRoomMap[alloc.course] = {};
      courseRoomMap[alloc.course][room.id] = (courseRoomMap[alloc.course][room.id]||0) + alloc.filled;
    }
  }

  let html = '';

  // Error box
  if(errors.length){
    html += `<div class="error-box"><strong>⚠ Warning:</strong><br>${errors.join('<br>')}</div>`;
  }

  // Status bar
  const placed = Object.values(courseTotals).reduce((s,v)=>s+v,0);
  const empty  = totalCap - placed;
  html += `
  <div class="status-bar">
    <div class="stat"><span class="stat-label">Total Students</span><span class="stat-value">${totalStudents}</span></div>
    <div class="stat"><span class="stat-label">Placed</span><span class="${placed===totalStudents?'stat-ok':'stat-warn'}">${placed}</span></div>
    <div class="stat"><span class="stat-label">Empty Seats</span><span class="stat-value">${empty}</span></div>
    <div class="stat"><span class="stat-label">Total Capacity</span><span class="stat-value">${totalCap}</span></div>
    <div class="stat"><span class="stat-label">Rooms</span><span class="stat-value">${rooms.length}</span></div>
    <div class="stat"><span class="stat-label">Courses</span><span class="stat-value">${validCourses.length}</span></div>
  </div>`;

  // Exam header
  html += `<div class="exam-header">
    <h2>${name}</h2>
    <p>Seat Plan &nbsp;|&nbsp; ${date} &nbsp;|&nbsp; ${time}</p>
  </div>`;

  // Rooms by building
  const buildings = [...new Set(rooms.map(r=>r.building))];
  for(const bld of buildings){
    const bldRooms = rooms.filter(r=>r.building===bld);
    html += `<div class="building-section">
      <div class="building-label">${bld === 'novus' ? '🏢 Novus Building' : '🏛 Main Building'}</div>`;

    for(const room of bldRooms){
      const allocs = roomAllocations[room.id] || [];
      const studentsHere = allocs.reduce((s,a)=>s+a.filled,0);
      const cap = room.rows * room.cols;

      // Build grid
      const grid = {}; // "r,c" -> course
      const sgs = getSubgrids(room.rows, room.cols);
      for(const alloc of allocs){
        const positions = sgs[alloc.sgIdx];
        for(let i=0;i<alloc.filled;i++){
          const [r,c] = positions[i];
          grid[`${r},${c}`] = alloc.course;
        }
      }

      // Table
            let table = `<table class="seat-grid"><thead><tr><th>Row</th>`;
      for(let c=1;c<=room.cols;c++) table += `<th>Col ${c}</th>`;
      table += `<th style="background:#f0f3f8;color:#1a2744;border-left:2px solid #c8972a;min-width:110px;">Invigilator</th>`;
      table += `</tr></thead><tbody>`;
      for(let r=1;r<=room.rows;r++){
        table += `<tr><td class="row-label">R${r}</td>`;
        for(let c=1;c<=room.cols;c++){
          const course = grid[`${r},${c}`];
          const cls = course ? colourMap[course]||'' : '';
          table += course
            ? `<td class="${cls}">${course}</td>`
            : `<td class="empty">—</td>`;
        }
        table += `<td style="border-left:2px solid #c8972a;background:#fffbf0;min-width:110px;"></td>`;
        table += `</tr>`;
      }
      table += `</tbody></table>`;

      // Legend chips
      const legendCourses = [...new Set(allocs.map(a=>a.course))];
      const legend = legendCourses.map(c=>{
        const count = allocs.filter(a=>a.course===c).reduce((s,a)=>s+a.filled,0);
        return `<span class="legend-chip ${colourMap[c]||''}">${c} = ${count}</span>`;
      }).join('');


      // Overflow cells for this room (max 2: top-left and top-right)
      const ovf       = roomOvf[room.id] || { left: null, right: null };
      const ovfCount  = (ovf.left ? ovf.left.count : 0) + (ovf.right ? ovf.right.count : 0);
      const totalHere = studentsHere + ovfCount;

      // Inject overflow column into table: extra <th> in header, extra <td> in Row 1 only
      let finalTable = table;
      const hasLeft  = !!ovf.left;
      const hasRight = !!ovf.right;

      if (hasLeft || hasRight) {
        const emptyCell = `<td style="border:1px dashed #e0c88a;background:#fffbf0;min-width:80px;"></td>`;

        // 1. Add extra <th> columns to header
        if (hasLeft) {
          finalTable = finalTable.replace(
            '<th>Row</th>',
            `<th style="color:#c8972a;font-size:9px;border:2px dashed #c8972a;min-width:90px;">OVF ←</th><th>Row</th>`
          );
        }
        if (hasRight) {
          finalTable = finalTable.replace(
            '</tr></thead>',
            `<th style="color:#c8972a;font-size:9px;border:2px dashed #c8972a;min-width:90px;">→ OVF</th></tr></thead>`
          );
        }

        // 2. For every body row, add placeholder or real cell
        finalTable = finalTable.replace(
          /(<tr><td class="row-label">(R\d+)<\/td>)([\s\S]*?)(<\/tr>)/g,
          (match, rowStart, rowNum, cells, rowEnd) => {
            const isR1 = rowNum === 'R1';

            const leftCell = hasLeft
              ? (isR1
                  ? `<td class="${colourMap[ovf.left.course]||''}" style="border:2px dashed #c8972a;font-size:10px;font-weight:700;white-space:nowrap;vertical-align:middle;">⊕ ${ovf.left.course}<br><small>+${ovf.left.count}</small></td>`
                  : emptyCell)
              : '';

            const rightCell = hasRight
              ? (isR1
                  ? `<td class="${colourMap[ovf.right.course]||''}" style="border:2px dashed #c8972a;font-size:10px;font-weight:700;white-space:nowrap;vertical-align:middle;">⊕ ${ovf.right.course}<br><small>+${ovf.right.count}</small></td>`
                  : emptyCell)
              : '';

            return `<tr>${leftCell}${rowStart}${cells}${rightCell}${rowEnd}`;
          }
        );
      }

      html += `<div class="room-card">
        <div class="room-card-header">
          <span class="rname">${room.id}</span>
          <span class="rmeta">${totalHere} students &nbsp;|&nbsp; ${cap - studentsHere} empty &nbsp;|&nbsp; ${room.rows}×${room.cols}${ovfCount ? ` &nbsp;|&nbsp; <span style="color:#e8b84b;">+${ovfCount} overflow</span>` : ''}</span>
        </div>
        <div class="room-card-body">${finalTable}</div>
        <div class="room-legend">${legend}${ovf.right ? `<span class="legend-chip" style="border:2px dashed #c8972a;color:#c8972a;">⊕ ${ovf.right.course} +${ovf.right.count}</span>` : ''}${ovf.left ? `<span class="legend-chip" style="border:2px dashed #c8972a;color:#c8972a;">⊕ ${ovf.left.course} +${ovf.left.count}</span>` : ''}</div>
      </div>`;
  }
}

  // Summary table
  html += `<div class="summary-section">
    <div class="summary-title">Summary Table</div>
    <table class="summary-table"><thead><tr>
      <th>Course</th>`;
  for(const room of rooms) html += `<th>${room.id}</th>`;
  html += `<th>Total</th></tr></thead><tbody>`;

  let roomColTotals = {};
  for(const course of validCourses){
    const total = courseTotals[course.code]||0;
    html += `<tr><td class="course-name">${course.code}</td>`;
    for(const room of rooms){
      const val = (courseRoomMap[course.code]||{})[room.id] || 0;
      roomColTotals[room.id] = (roomColTotals[room.id]||0)+val;
      html += val ? `<td>${val}</td>` : `<td class="zero">—</td>`;
    }
    html += `<td><strong>${total}</strong></td></tr>`;
  }

  // Total row
  html += `<tr class="total-row"><td>Total</td>`;
  for(const room of rooms){
    html += `<td>${roomColTotals[room.id]||0}</td>`;
  }
  html += `<td class="grand">${placed}</td></tr>`;
  html += `</tbody></table></div>`;

  document.getElementById('output').innerHTML = html;
}

async function exportDocx() {
  const lib = window.docx || (typeof docx !== 'undefined' ? docx : null);
  if (!lib) {
    alert('Word export library failed to load.\n\nFix: Open the HTML file in a browser with internet access, or download docx from:\nhttps://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js\nand place it in the same folder as index.html, then change the script src to "index.umd.js".');
    return;
  }
  const { Document, Packer, Table, TableRow, TableCell, Paragraph, TextRun,
          WidthType, BorderStyle, AlignmentType, HeadingLevel, ShadingType } = lib;

  const name = document.getElementById('examName').value.trim();
  const date = document.getElementById('examDate').value.trim();
  const time = document.getElementById('examTime').value.trim();
  const validCourses = courses.filter(c=>c.code&&c.n>0);
  if (!validCourses.length) { alert('Generate a seat plan first.'); return; }

  const {roomAllocations, roomOvf, courseTotals} = allocate(rooms, validCourses);

  const colourMap={};
  validCourses.forEach((c,i)=>colourMap[c.code]=['E8F4FD','EAFAF1','FEF9E7','FDF2F8','F0F3FF',
    'FFF5F5','F0FAF5','FFFBF0','F5F0FF','F0F9FF','FFF0F6','F0FFF4'][i%12]);

  const children=[];

  // Title
  children.push(new Paragraph({
    children:[new TextRun({text:name,bold:true,size:32})],
    alignment:AlignmentType.CENTER, spacing:{after:120}
  }));
  children.push(new Paragraph({
    children:[new TextRun({text:`Seat Plan  |  ${date}  |  ${time}`,size:22,color:'444444'})],
    alignment:AlignmentType.CENTER, spacing:{after:300}
  }));

  const border={style:BorderStyle.SINGLE,size:4,color:'DCE2EC'};
  const goldBorder={style:BorderStyle.SINGLE,size:8,color:'C8972A'};

  for (const room of rooms) {
    const allocs = roomAllocations[room.id]||[];
    const ovf    = roomOvf[room.id]||{left:null,right:null};
    const sgs    = getSubgrids(room.rows, room.cols);
    const grid   = {};
    for (const alloc of allocs) {
      const positions=sgs[alloc.sgIdx];
      for (let i=0;i<alloc.filled;i++) { const [r,c]=positions[i]; grid[`${r},${c}`]=alloc.course; }
    }

    // Room heading
    const studentsHere=allocs.reduce((s,a)=>s+a.filled,0)+
      (ovf.left?ovf.left.count:0)+(ovf.right?ovf.right.count:0);
    children.push(new Paragraph({
      children:[new TextRun({text:`${room.id}   —   ${studentsHere} students  |  ${room.rows}×${room.cols}`,bold:true,size:22,color:'243058'})],
      spacing:{before:280,after:80}
    }));

    // Header row
    const hdrCells=[
      new TableCell({children:[new Paragraph({children:[new TextRun({text:'Row',bold:true,size:16})],alignment:AlignmentType.CENTER})],
        shading:{fill:'F0F3F8'},borders:{top:border,bottom:border,left:border,right:border},width:{size:8,type:WidthType.PERCENTAGE}}),
    ];
    for (let c=1;c<=room.cols;c++) hdrCells.push(new TableCell({
      children:[new Paragraph({children:[new TextRun({text:`Col ${c}`,bold:true,size:16})],alignment:AlignmentType.CENTER})],
      shading:{fill:'F0F3F8'},borders:{top:border,bottom:border,left:border,right:border},width:{size:Math.floor(72/room.cols),type:WidthType.PERCENTAGE}
    }));
    hdrCells.push(new TableCell({
      children:[new Paragraph({children:[new TextRun({text:'Invigilator',bold:true,size:16,color:'1A2744'})],alignment:AlignmentType.CENTER})],
      shading:{fill:'F0F3F8'},borders:{top:border,bottom:border,left:goldBorder,right:border},width:{size:20,type:WidthType.PERCENTAGE}
    }));

    const tableRows=[new TableRow({children:hdrCells,tableHeader:true})];

    for (let r=1;r<=room.rows;r++) {
      const cells=[
        new TableCell({children:[new Paragraph({children:[new TextRun({text:`R${r}`,size:16,color:'6B7591'})],alignment:AlignmentType.CENTER})],
          shading:{fill:'F8F9FC'},borders:{top:border,bottom:border,left:border,right:border},width:{size:8,type:WidthType.PERCENTAGE}}),
      ];
      for (let c=1;c<=room.cols;c++) {
        const course=grid[`${r},${c}`]||'';
        const fill=course?colourMap[course]||'FFFFFF':'FFFFFF';
        cells.push(new TableCell({
          children:[new Paragraph({children:[new TextRun({text:course,size:16,bold:!!course})],alignment:AlignmentType.CENTER})],
          shading:{fill,type:ShadingType.CLEAR},
          borders:{top:border,bottom:border,left:border,right:border},
          width:{size:Math.floor(72/room.cols),type:WidthType.PERCENTAGE}
        }));
      }
      // Invigilator column (overflow on row 1, blank otherwise)
      const ovfText = r===1 && (ovf.right||ovf.left)
        ? [ovf.left?`⊕${ovf.left.course}+${ovf.left.count}`:'',
           ovf.right?`⊕${ovf.right.course}+${ovf.right.count}`:''].filter(Boolean).join('  ')
        : '';
      cells.push(new TableCell({
        children:[new Paragraph({children:[new TextRun({text:ovfText,size:14,color:ovfText?'C8972A':'000000'})],alignment:AlignmentType.LEFT})],
        shading:{fill:'FFFBF0'},borders:{top:border,bottom:border,left:goldBorder,right:border},
        width:{size:20,type:WidthType.PERCENTAGE}
      }));
      tableRows.push(new TableRow({children:cells}));
    }

    children.push(new Table({rows:tableRows,width:{size:100,type:WidthType.PERCENTAGE}}));
    children.push(new Paragraph({text:'',spacing:{after:200}}));
  }

  const doc = new Document({sections:[{children}]});
  const blob = await Packer.toBlob(doc);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`SeatPlan_${date.replace(/\./g,'_')}.docx`;
  a.click();
}
renderRooms();
renderCourses();
</script>
